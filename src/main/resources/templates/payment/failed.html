<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Payment Failed | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/cinemax-ui.css}">
</head>


<body class="bg-dark">
<div th:replace="~{fragments/site-header :: header}"></div>

<div class="container py-5">

    <div
        class="card mx-auto text-center"
        style="max-width:650px">

        <div class="card-body p-5">

            <h1 class="text-danger">
                ✕ Payment Failed
            </h1>


            <p>
                Your payment could not be completed.
            </p>


            <p>

                Transaction:

                <strong
                    th:text="${payment.transactionReference}">
                </strong>

            </p>


            <p>

                Status:

                <span
                    class="badge bg-danger"
                    th:text="${payment.status}">
                </span>

            </p>


            <div class="alert alert-warning">

                Your booking has been cancelled
                and the seats have been released.

            </div>


            <a
                th:href="@{/movies}"
                class="btn btn-dark">

                Select Another Show

            </a>

        </div>

    </div>

</div>

<div th:replace="~{fragments/site-footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cinemax-ui.js}"></script>
</body>
</html>
