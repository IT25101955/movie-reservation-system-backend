<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Dashboard | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/admin-sidebar.css}">

</head>

<body>

<div class="admin-layout">

    <!-- MOBILE MENU BUTTON -->
    <button
        type="button"
        id="adminMenuButton"
        class="admin-menu-button">
        ☰
    </button>

    <!-- SIDEBAR -->
    <div
        th:replace="~{fragments/admin-sidebar :: sidebar('dashboard')}">
    </div>

    <!-- MAIN CONTENT -->
    <main class="admin-main-content">

        <div class="mb-4">
            <h2>Dashboard</h2>
            <p class="text-muted">Welcome to the CineMax Administration panel.</p>
        </div>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Total Users</h6><h2 th:text="${stats.totalUsers}">0</h2>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Confirmed Bookings</h6><h2 th:text="${stats.confirmedBookings}">0</h2>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Tickets Sold</h6><h2 th:text="${stats.ticketsSold}">0</h2>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Total Revenue</h6>
                    <h2>Rs. <span th:text="${stats.totalRevenue}">0</span></h2>
                </div></div>
            </div>
        </div>

        <div class="row g-3 mt-2">
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Movies</h6><h3 th:text="${stats.totalMovies}">0</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Active Shows</h6><h3 th:text="${stats.activeShows}">0</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Active Users</h6><h3 th:text="${stats.activeUsers}">0</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm h-100"><div class="card-body">
                    <h6>Pending Payments</h6><h3 th:text="${stats.pendingPayments}">0</h3>
                </div></div>
            </div>
        </div>

    </main>

</div>

<script th:src="@{/js/admin-sidebar.js}"></script>

</body>
</html>
