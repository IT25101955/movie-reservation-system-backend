<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Seats | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .seat-row { margin-bottom: 24px; padding: 18px; border: 1px solid #ddd; border-radius: 10px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .row-header h4 { margin: 0; }
        .vip-row-control { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
        .vip-row-checkbox { width: 18px; height: 18px; }
        .row-seats { display: flex; gap: 8px; flex-wrap: wrap; }
        .seat { min-width: 48px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 7px; font-weight: 600; }
        .standard-seat { border: 2px solid #777; background: white; }
        .vip-seat { border: 2px solid #b8860b; background: #fff4c2; }
    </style>
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('theatres')}"></div>
<main class="admin-main-content">
<main class="container py-5">
    <a th:href="@{/admin/theatres}" class="btn btn-link px-0">Back to Theatres</a>
    <h2 th:text="${theatre.name}"></h2>
    <p class="text-muted">Choose VIP rows. All other active seats remain Standard.</p>
    <div class="bg-dark text-white text-center py-2 mb-4">SCREEN</div>

    <form th:action="@{/admin/theatres/{id}/seats/vip-rows(id=${theatre.id})}" method="post">
        <div th:each="row : ${rows}" class="seat-row" th:attr="data-row=${row}">
            <div class="row-header">
                <h4>Row <span th:text="${row}"></span></h4>
                <label class="vip-row-control">
                    <input type="checkbox" name="vipRows" th:value="${row}"
                           th:checked="${vipRows.contains(row)}" class="vip-row-checkbox">
                    VIP Row
                </label>
            </div>
            <div class="row-seats">
                <div th:each="seat : ${seats}" th:if="${seat.rowLabel == row}"
                     class="seat"
                     th:classappend="${seat.seatCategory.name() == 'VIP' ? ' vip-seat' : ' standard-seat'}">
                    <span th:text="${seat.seatCode}"></span>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Seating Changes</button>
    </form>
</main>
</main>
</div>
<script>
    document.querySelectorAll('.vip-row-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            const row = document.querySelector(`.seat-row[data-row="${this.value}"]`);
            if (!row) return;
            row.querySelectorAll('.seat').forEach(seat => {
                seat.classList.toggle('vip-seat', this.checked);
                seat.classList.toggle('standard-seat', !this.checked);
            });
        });
    });
</script>
<script th:src="@{/js/admin-sidebar.js}"></script>
</body>
</html>
