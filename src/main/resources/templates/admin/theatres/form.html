<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Theatre | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>

<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('theatres')}"></div>
<main class="admin-main-content">


<div class="container py-5">

    <div class="card shadow mx-auto"
         style="max-width:700px">

        <div class="card-body">

            <h2>
                Theatre Details
            </h2>

            <form
                th:action="@{/admin/theatres/save}"
                th:object="${theatre}"
                method="post">

                <input
                    type="hidden"
                    th:field="*{id}">


                <div class="mb-3">

                    <label class="form-label">
                        Theatre Name
                    </label>

                    <input
                        class="form-control"
                        th:field="*{name}">

                    <div class="text-danger"
                         th:errors="*{name}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        class="form-control"
                        th:field="*{location}">

                    <div class="text-danger"
                         th:errors="*{location}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">Facilities</label>
                    <div class="row">
                        <div class="col-md-6" th:each="facility : ${facilities}">
                            <label class="form-check mb-2">
                                <input class="form-check-input" type="checkbox"
                                       name="facilityIds" th:value="${facility.id}"
                                       th:checked="${selectedFacilityIds.contains(facility.id)}">
                                <span class="form-check-label" th:text="${facility.name}"></span>
                            </label>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Seat Rows</label>
                            <input class="form-control" type="number" min="1" th:field="*{rowCount}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Seats Per Row</label>
                            <input class="form-control" type="number" min="1" th:field="*{seatsPerRow}">
                        </div>
                    </div>

                </div>


                <button class="btn btn-primary">
                    Save Theatre
                </button>

                <a th:href="@{/admin/theatres}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</main>
</div>
<script th:src="@{/js/admin-sidebar.js}"></script>
</body>
</html>
