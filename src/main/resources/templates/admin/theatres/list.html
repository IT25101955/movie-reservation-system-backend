<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Theatres | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/admin-sidebar.css}">

</head>

<body>

<div class="admin-layout">

    <!-- MOBILE MENU BUTTON -->
    <button
        type="button"
        id="adminMenuButton"
        class="admin-menu-button">
        ☰
    </button>

    <!-- SIDEBAR -->
    <div
        th:replace="~{fragments/admin-sidebar :: sidebar('theatres')}">
    </div>

    <!-- MAIN CONTENT -->
    <main class="admin-main-content">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2>Theatre Management</h2>
                <p class="text-muted">Manage cinema locations, seating configurations and facilities.</p>
            </div>

            <a th:href="@{/admin/theatres/add}"
               class="btn btn-primary">

                + Add Theatre

            </a>

        </div>


        <div th:if="${param.success}"
             class="alert alert-success">

            Theatre saved successfully.

        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Facilities</th>
                            <th>Status</th>
                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="theatre : ${theatres}">

                            <td th:text="${theatre.id}"></td>

                            <td th:text="${theatre.name}"></td>

                            <td th:text="${theatre.location}"></td>

                            <td>
                                <span th:each="facility, status : ${theatre.facilities}">
                                    <span th:text="${facility.name}"></span><span th:if="${!status.last}"> • </span>
                                </span>
                            </td>

                            <td>
                                <span th:if="${theatre.active}"
                                      class="badge bg-success">ACTIVE</span>
                                <span th:unless="${theatre.active}"
                                      class="badge bg-secondary">DELETED</span>
                            </td>

                            <td>

                                <a
                                    th:if="${theatre.active}"
                                    th:href="@{/admin/theatres/edit/{id}(id=${theatre.id})}"
                                    class="btn btn-sm btn-warning">

                                    Edit

                                </a>

                                <a th:if="${theatre.active}"
                                   th:href="@{/admin/theatres/{id}/seats(id=${theatre.id})}"
                                   class="btn btn-sm btn-info">Manage Seats</a>

                                <form
                                    th:action="@{/admin/theatres/{id}/delete(id=${theatre.id})}"
                                    method="post"
                                    class="d-inline">

                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                    <button
                                        type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('Delete this theatre?')">

                                        Delete

                                    </button>

                                </form>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(theatres)}">
                            <td colspan="6" class="text-center text-muted">No theatres found.</td>
                        </tr>

                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </main>

</div>

<script th:src="@{/js/admin-sidebar.js}"></script>

</body>
</html>
