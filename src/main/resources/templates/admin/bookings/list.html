<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Management | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('bookings')}"></div>
<main class="admin-main-content">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('bookings')}"></div>
<main class="container py-5 admin-main-content">
    <div class="d-flex justify-content-between align-items-center">
        <h2>🎟 Booking Management</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-dark">Dashboard</a>
    </div>

    <form method="get" class="row my-4">
        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="">All Booking Statuses</option>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary">Filter</button></div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover bg-white shadow-sm align-middle">
            <thead><tr><th>Reference</th><th>Customer</th><th>Movie</th><th>Total</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.bookingReference}"></td>
                <td><span th:text="${booking.user.fullName}"></span><br><small th:text="${booking.user.email}"></small></td>
                <td>
                    <span th:if="${booking.showSchedule != null}" th:text="${booking.showSchedule.movie.title}"></span>
                    <span th:if="${booking.showSchedule == null}" class="text-warning">Show unavailable</span>
                </td>
                <td>Rs. <span th:text="${booking.totalAmount}"></span></td>
                <td th:text="${booking.status}"></td>
                <td><a th:href="@{/admin/bookings/{id}(id=${booking.id})}" class="btn btn-sm btn-primary">Details</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" class="text-center text-muted">No bookings found.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</main>
</div>
<script th:src="@{/js/admin-sidebar.js}"></script>
</body>
</html>
