<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Movie Management | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/admin-sidebar.css}">

</head>

<body>

<div class="admin-layout">

    <!-- MOBILE MENU BUTTON -->
    <button
        type="button"
        id="adminMenuButton"
        class="admin-menu-button">
        ☰
    </button>

    <!-- SIDEBAR -->
    <div
        th:replace="~{fragments/admin-sidebar :: sidebar('movies')}">
    </div>

    <!-- MAIN CONTENT -->
    <main class="admin-main-content">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2>Movie Management</h2>

                <p class="text-muted">
                    Add, update, search and manage CineMax movies.
                </p>

            </div>

            <a th:href="@{/admin/movies/add}"
               class="btn btn-primary">

                + Add Movie

            </a>

        </div>


        <div
            th:if="${success}"
            class="alert alert-success"
            role="alert"
            th:text="${success}">
        </div>

        <div
            th:if="${error}"
            class="alert alert-danger"
            role="alert"
            th:text="${error}">
        </div>

        <div th:if="${param.success}"
             class="alert alert-success">

            Movie saved successfully.

        </div>


        <div th:if="${param.deleted}"
             class="alert alert-success">

            Movie deleted successfully.

        </div>

        <form method="get"
              th:action="@{/admin/movies}"
              class="row g-2 mb-4">

            <div class="col-md-9">

                <input
                    type="text"
                    name="keyword"
                    th:value="${keyword}"
                    class="form-control"
                    placeholder="Search movie by title">

            </div>

            <div class="col-md-3">

                <button class="btn btn-dark w-100"
                        type="submit">

                    Search

                </button>

            </div>

        </form>


        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                        <tr>

                            <th>ID</th>

                            <th>Title</th>

                            <th>Genre</th>

                            <th>Language</th>

                            <th>Duration</th>

                            <th>Movie Status</th>

                            <th>Availability</th>

                            <th>Actions</th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="movie : ${movies}">

                            <td th:text="${movie.id}">
                            </td>

                            <td th:text="${movie.title}">
                            </td>

                            <td th:text="${movie.genre}">
                            </td>

                            <td th:text="${movie.language}">
                            </td>

                            <td>
                                <span th:text="${movie.durationMinutes}">
                                </span>
                                min
                            </td>

                            <td>

                                <span class="badge bg-secondary"
                                      th:text="${movie.status}">
                                </span>

                            </td>

                            <td>

                                <span th:if="${movie.active}"
                                      class="badge bg-success">ACTIVE</span>

                                <span th:unless="${movie.active}"
                                      class="badge bg-secondary">DELETED</span>

                            </td>

                            <td>

                                <a
                                    th:href="@{/admin/movies/view/{id}(id=${movie.id})}"
                                    class="btn btn-sm btn-info">

                                    View

                                </a>


                                <a
                                    th:if="${movie.active}"
                                    th:href="@{/admin/movies/edit/{id}(id=${movie.id})}"
                                    class="btn btn-sm btn-warning">

                                    Edit

                                </a>


                                <form
                                    th:action="@{/admin/movies/{id}/delete(id=${movie.id})}"
                                    method="post"
                                    class="d-inline">

                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                    <button
                                        type="submit"
                                        class="btn btn-sm btn-danger"
                                        onclick="return confirm('Are you sure you want to delete this movie?')">

                                        Delete

                                    </button>

                                </form>

                            </td>

                        </tr>


                        <tr th:if="${#lists.isEmpty(movies)}">

                            <td colspan="8"
                                class="text-center text-muted">

                                No movies found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/admin-sidebar.js}"></script>

</body>
</html>
