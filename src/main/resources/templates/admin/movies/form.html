<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Movie Form | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>


<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('movies')}"></div>
<main class="admin-main-content">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            🎬 CineMax Movies

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">


                    <h2 th:text="${movie.id == null}
                        ? 'Add Movie'
                        : 'Update Movie'">
                    </h2>


                    <form
                        th:action="@{/admin/movies/save}"
                        th:object="${movie}"
                        method="post">


                        <input
                            type="hidden"
                            th:field="*{id}">


                        <div class="mb-3">

                            <label class="form-label">
                                Movie Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{title}">

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('title')}"
                                th:errors="*{title}">
                            </div>

                        </div>


                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Genre
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{genre}">

                                <div
                                    class="text-danger"
                                    th:if="${#fields.hasErrors('genre')}"
                                    th:errors="*{genre}">
                                </div>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Language
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{language}">

                                <div
                                    class="text-danger"
                                    th:if="${#fields.hasErrors('language')}"
                                    th:errors="*{language}">
                                </div>

                            </div>

                        </div>


                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Duration (minutes)
                                </label>

                                <input
                                    type="number"
                                    min="1"
                                    class="form-control"
                                    th:field="*{durationMinutes}">

                                <div
                                    class="text-danger"
                                    th:if="${#fields.hasErrors('durationMinutes')}"
                                    th:errors="*{durationMinutes}">
                                </div>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Release Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    th:field="*{releaseDate}">

                                <div
                                    class="text-danger"
                                    th:if="${#fields.hasErrors('releaseDate')}"
                                    th:errors="*{releaseDate}">
                                </div>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Cast
                            </label>

                            <textarea
                                class="form-control"
                                rows="2"
                                th:field="*{cast}">
                            </textarea>

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('cast')}"
                                th:errors="*{cast}">
                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                th:field="*{description}">
                            </textarea>

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('description')}"
                                th:errors="*{description}">
                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Poster URL
                            </label>

                            <input
                                type="url"
                                class="form-control"
                                th:field="*{posterUrl}">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Trailer URL
                            </label>

                            <input
                                type="url"
                                class="form-control"
                                th:field="*{trailerUrl}">

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Movie Status
                            </label>

                            <select
                                class="form-select"
                                th:field="*{status}">

                                <option value="">
                                    Select status
                                </option>

                                <option
                                    th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                                </option>

                            </select>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Save Movie

                            </button>


                            <a
                                th:href="@{/admin/movies}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</main>
</div>
<script th:src="@{/js/admin-sidebar.js}"></script>
</body>
</html>
