<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Show Scheduling | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <style>
        .movie-schedule-group { margin-bottom:22px; border:1px solid #ddd; border-radius:12px; overflow:hidden; background:white; }
        .movie-group-header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 20px; background:#202428; }
        .schedule-toggle { display:flex; align-items:center; gap:12px; border:none; background:transparent; color:white; font-size:19px; cursor:pointer; }
        .toggle-arrow { transition:transform .2s ease; }
        .movie-schedule-group.collapsed .toggle-arrow { transform:rotate(-90deg); }
        .movie-schedule-group.collapsed .movie-group-content { display:none; }
        .delete-all-btn { padding:9px 14px; border:none; border-radius:7px; background:#dc3545; color:white; cursor:pointer; }
        .theatre-group { padding:20px; border-bottom:1px solid #eee; }
        .theatre-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; }
        .theatre-header h3 { margin:0; }
        .price-summary { display:flex; gap:20px; flex-wrap:wrap; font-size:14px; }
        .date-show-group { display:flex; align-items:flex-start; gap:25px; padding:14px 0; border-top:1px solid #eee; }
        .schedule-date { width:150px; flex-shrink:0; font-weight:600; }
        .schedule-times { display:flex; gap:10px; flex-wrap:wrap; }
        .show-time-item { display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid #ddd; border-radius:7px; background:#f8f9fa; }
        .show-time { font-weight:700; }
        .active-badge { padding:2px 6px; border-radius:5px; background:#198754; color:white; font-size:10px; }
        .edit-show-btn { text-decoration:none; font-size:12px; }
        .delete-show-btn { border:none; background:#dc3545; color:white; border-radius:5px; cursor:pointer; }
        @media (max-width:700px) { .movie-group-header,.theatre-header,.date-show-group { flex-direction:column; align-items:stretch; } .schedule-date { width:auto; } }
    </style>
</head>
<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('shows')}"></div>
<main class="admin-main-content">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('shows')}"></div>
<main class="container py-5 admin-main-content">
    <div class="d-flex justify-content-between mb-4">
        <div>
            <h2>Show Scheduling</h2>
            <p class="text-muted">Manage movie showtimes and ticket prices.</p>
        </div>
        <a th:href="@{/admin/shows/add}" class="btn btn-primary">+ Create Show</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${param.success}" class="alert alert-success">Show schedule saved successfully.</div>

    <div th:if="${#lists.isEmpty(scheduleGroups)}" class="alert alert-secondary">No show schedules found.</div>
    <div class="schedule-list">
        <div th:each="movieGroup : ${scheduleGroups}" class="movie-schedule-group">
            <div class="movie-group-header">
                <button type="button" class="schedule-toggle">
                    <span class="toggle-arrow">▼</span>
                    <span class="movie-title">🎬 <span th:text="${movieGroup.movieTitle}"></span></span>
                </button>
                <form th:action="@{/admin/shows/movie/{id}/delete-all(id=${movieGroup.movieId})}" method="post" class="delete-all-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="delete-all-btn" onclick="return confirm('Delete ALL schedules for this movie from every theatre and date?');">Delete All Schedules</button>
                </form>
            </div>
            <div class="movie-group-content">
                <div th:each="theatre : ${movieGroup.theatres}" class="theatre-group">
                    <div class="theatre-header">
                        <h3>🏢 <span th:text="${theatre.theatreName}"></span></h3>
                        <div class="price-summary">
                            <span>Adult: LKR <strong th:text="${theatre.adultPrice}"></strong></span>
                            <span>Child: LKR <strong th:text="${theatre.childPrice}"></strong></span>
                            <span>VIP: LKR <strong th:text="${theatre.vipPrice}"></strong></span>
                        </div>
                    </div>
                    <div th:each="dateGroup : ${theatre.dates}" class="date-show-group">
                        <div class="schedule-date">📅 <span th:text="${#temporals.format(dateGroup.date, 'EEE, MMM dd')}"></span></div>
                        <div class="schedule-times">
                            <div th:each="show : ${dateGroup.shows}" class="show-time-item">
                                <span class="show-time" th:text="${#temporals.format(show.startTime, 'HH:mm')}"></span>
                                <span th:if="${show.active}" class="active-badge">ACTIVE</span>
                                <a th:href="@{/admin/shows/{id}/edit(id=${show.id})}" class="edit-show-btn">Edit</a>
                                <form th:action="@{/admin/shows/{id}/delete(id=${show.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="delete-show-btn" onclick="return confirm('Delete this show?');">×</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</main>
</div>
<script th:src="@{/js/admin-sidebar.js}"></script>
<script>
    document.querySelectorAll('.schedule-toggle').forEach(button => {
        button.addEventListener('click', () => button.closest('.movie-schedule-group').classList.toggle('collapsed'));
    });
</script>
</body>
</html>
