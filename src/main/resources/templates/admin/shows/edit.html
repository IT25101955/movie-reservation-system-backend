<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Shows | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="bg-light">
<div class="admin-layout">
<button type="button" id="adminMenuButton" class="admin-menu-button">☰</button>
<div th:replace="~{fragments/admin-sidebar :: sidebar('shows')}"></div>
<main class="admin-main-content">
<main class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 760px">
        <div class="card-body">
            <h2>Edit Shows</h2>
            <div th:if="${scheduleError}" class="alert alert-danger" th:text="${scheduleError}"></div>
            <form th:action="@{/admin/shows/update}" th:object="${showUpdate}" method="post">
                <input type="hidden" th:field="*{movieId}">
                <input type="hidden" th:field="*{theatreId}">
                <input type="hidden" th:field="*{showDate}">
                <div class="mb-3">
                    <strong>Movie:</strong> <span th:text="${dayShows[0].movie.title}"></span>
                    <span class="mx-2">|</span>
                    <strong>Theatre:</strong> <span th:text="${dayShows[0].theatre.name}"></span>
                    <span class="mx-2">|</span>
                    <strong>Date:</strong> <span th:text="${showUpdate.showDate}"></span>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label">Adult Price</label><input type="number" min="0.01" step="0.01" class="form-control" th:field="*{adultPrice}"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Child Price</label><input type="number" min="0.01" step="0.01" class="form-control" th:field="*{childPrice}"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">VIP Price</label><input type="number" min="0.01" step="0.01" class="form-control" th:field="*{vipPrice}"></div>
                </div>
                <div id="rows">
                    <div class="show-time-row d-flex align-items-center gap-2 mb-2" th:each="show, stat : ${dayShows}">
                        <input type="hidden" name="showIds" th:value="${show.id}">
                        <input type="time" name="startTimes" class="form-control" th:value="${show.startTime}" required>
                        <span class="text-muted" th:text="${show.endTime}"></span>
                        <button type="button" class="remove-time btn btn-outline-danger">Remove</button>
                    </div>
                </div>
                <button type="button" id="add" class="btn btn-outline-primary">+ Add Show</button>
                <button class="btn btn-primary">Save Changes</button>
                <a th:href="@{/admin/shows}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>
</main>
</div>
<script>
    const rows = document.getElementById('rows');
    function bindRemove(button) { button.addEventListener('click', () => button.closest('.show-time-row').remove()); }
    document.querySelectorAll('.remove-time').forEach(bindRemove);
    document.getElementById('add').addEventListener('click', () => {
        const row = document.createElement('div');
        row.className = 'show-time-row d-flex align-items-center gap-2 mb-2';
        row.innerHTML = '<input type="time" name="startTimes" class="form-control" required>'
            + '<input type="hidden" name="showIds" value="">'
            + '<span class="text-muted">Calculated on save</span>'
            + '<button type="button" class="remove-time btn btn-outline-danger">Remove</button>';
        rows.appendChild(row);
        bindRemove(row.querySelector('.remove-time'));
    });
</script>
<script th:src="@{/js/admin-sidebar.js}"></script>
</body>
</html>
