<!DOCTYPE html>

<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Notifications | CineMax
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/cinemax-ui.css}">
</head>


<body class="bg-light">
<div th:replace="~{fragments/site-header :: header}"></div>


<div
    class="container py-5"
    style="max-width:900px;">


    <!-- PAGE HEADER -->

    <div
        class="
        d-flex
        flex-wrap
        justify-content-between
        align-items-center
        gap-2
        mb-4">


        <div>

            <h2>
                🔔 Notifications
            </h2>

            <p class="text-muted mb-0">

                Booking updates,
                cancellation/refund results
                and CineMax offers.

            </p>

        </div>


        <div class="d-flex gap-2">


            <!-- MARK ALL READ -->

            <form

                th:if="
                ${!#lists.isEmpty(notifications)}"

                th:action="
                @{/account/notifications/mark-all-read}"

                method="post">


                <button
                    class=
                    "btn btn-outline-primary btn-sm">

                    Mark All as Read

                </button>


            </form>


            <!-- CLEAR ALL -->

            <form

                th:if="
                ${!#lists.isEmpty(notifications)}"

                th:action="
                @{/account/notifications/clear-all}"

                method="post"

                onsubmit="
                return confirm(
                'Clear all of your notifications?');">


                <button
                    class=
                    "btn btn-outline-danger btn-sm">

                    Clear All

                </button>


            </form>


        </div>


    </div>


    <!-- NO NOTIFICATIONS -->

    <div

        th:if="
        ${#lists.isEmpty(notifications)}"

        class="alert alert-info">


        You do not have any notifications yet.


    </div>


    <!-- NOTIFICATION CARDS -->

    <div

        th:each="
        notification :
        ${notifications}"

        class=
        "card mb-3 shadow-sm"

        th:classappend="
        ${!notification.read}
        ? ' border-primary'
        : ''">


        <div class="card-body">


            <!-- TOP AREA -->

            <div
                class="
                d-flex
                justify-content-between
                align-items-start
                gap-3">


                <div>


                    <!-- TYPE -->

                    <div class="mb-2">


                        <span

                            class=
                            "badge bg-secondary"

                            th:text="
                            ${notification.type}">

                            TYPE

                        </span>


                        <!-- NEW badge -->

                        <span

                            th:if="
                            ${!notification.read}"

                            class=
                            "badge bg-primary">

                            NEW

                        </span>


                    </div>


                    <h5
                        th:text="
                        ${notification.title}">

                        Notification Title

                    </h5>


                </div>


                <!-- DATE -->

                <small

                    class="text-muted"

                    th:text="
                    ${#temporals.format(
                    notification.createdAt,
                    'yyyy-MM-dd HH:mm')}">

                    Date

                </small>


            </div>


            <!--
            white-space: pre-line is important.

            It preserves lines such as:

            Total Paid
            Refund Amount
            Amount Retained
            -->

            <p

                class="mt-3 mb-3"

                style="
                white-space: pre-line;"

                th:text="
                ${notification.message}">

                Notification message

            </p>


            <div
                class="
                d-flex
                justify-content-between
                align-items-center
                flex-wrap
                gap-2">


                <!-- EMAIL STATUS -->

                <small class="text-muted">


                    <span
                        th:if="
                        ${notification.emailStatus.name()
                        == 'SENT'}">

                        Email sent

                    </span>


                    <span
                        th:if="
                        ${notification.emailStatus.name()
                        == 'FAILED'}">

                        Email failed

                    </span>


                    <span
                        th:if="
                        ${notification.emailStatus.name()
                        == 'NOT_ATTEMPTED'}">

                        In-app notification

                    </span>


                </small>


                <div class="d-flex gap-2">


                    <!-- MARK ONE AS READ -->

                    <form

                        th:if="
                        ${!notification.read}"

                        th:action="
                        @{/account/notifications/{id}/read(
                        id=${notification.id})}"

                        method="post">


                        <button
                            class=
                            "btn btn-sm btn-outline-primary">

                            Mark as Read

                        </button>


                    </form>


                    <!-- DELETE ONE -->

                    <form

                        th:action="
                        @{/account/notifications/{id}/delete(
                        id=${notification.id})}"

                        method="post"

                        onsubmit="
                        return confirm(
                        'Delete this notification?');">


                        <button
                            class=
                            "btn btn-sm btn-outline-danger">

                            Delete

                        </button>


                    </form>


                </div>


            </div>


        </div>


    </div>


    <a

        th:href="@{/customer/dashboard}"

        class=
        "btn btn-secondary mt-3">

        Back to Dashboard

    </a>


</div>


<div th:replace="~{fragments/site-footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cinemax-ui.js}"></script>
</body>

</html>
