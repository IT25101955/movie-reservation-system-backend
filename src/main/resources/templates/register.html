<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | CineMax</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/cinemax-ui.css}"></head><body><div th:replace="~{fragments/site-header :: header}"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-6 col-xl-5"><div class="text-center mb-4"><h1 class="h2">Create your CineMax account</h1><p class="text-muted">Book movies and keep your reservations in one place.</p></div><div class="card shadow-sm"><div class="card-body p-4 p-md-5"><form th:action="@{/register}" th:object="${user}" method="post"><div class="mb-3"><label class="form-label" for="fullName">Full Name</label><input id="fullName" type="text" th:field="*{fullName}" class="form-control" placeholder="Your full name" required><div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div><div class="mb-3"><label class="form-label" for="email">Email Address</label><input id="email" type="email" th:field="*{email}" class="form-control" maxlength="150" autocomplete="email" placeholder="example@gmail.com" required><div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div><div class="form-text">Used for login and CineMax notifications.</div></div><div class="mb-3"><label class="form-label" for="phone">Phone</label><input id="phone" type="text" th:field="*{phone}" class="form-control" placeholder="Your phone number"></div><div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" type="password" th:field="*{password}" class="form-control" autocomplete="new-password" placeholder="Create a password" required><div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div><button class="btn btn-danger btn-lg w-100" type="submit">Create Account</button></form><div class="text-center mt-4"><span class="text-muted">Already have an account?</span> <a th:href="@{/login}" class="text-decoration-none fw-semibold">Login</a></div></div></div></div></div></main><div th:replace="~{fragments/site-footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/cinemax-ui.js}"></script></body></html>
