<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Screen | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div th:if="${screenError}" class="container mt-4">
    <div class="alert alert-danger" th:text="${screenError}"></div>
</div>

<div class="container py-5">

    <div class="card shadow mx-auto"
         style="max-width:700px">

        <div class="card-body">

            <h2>Add Cinema Screen</h2>

            <form
                th:action="@{/admin/screens/save}"
                th:object="${screen}"
                method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">
                        Theatre
                    </label>

                    <select
                        name="theatreId"
                        class="form-select"
                        required>

                        <option value="">
                            Select Theatre
                        </option>

                        <option
                            th:each="theatre : ${theatres}"
                            th:value="${theatre.id}"
                            th:text="${theatre.name + ' - ' + theatre.location}"
                            th:selected="${screen.theatre != null
                                && screen.theatre.id == theatre.id}">
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Screen Name
                    </label>

                    <input
                        class="form-control"
                        th:field="*{name}">
                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Number of Rows
                    </label>

                    <input
                        type="number"
                        min="1"
                        class="form-control"
                        th:field="*{rowCount}">
                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Seats Per Row
                    </label>

                    <input
                        type="number"
                        min="1"
                        class="form-control"
                        th:field="*{seatsPerRow}">
                </div>

                <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('name')}"
                    th:errors="*{name}">
                </div>

                <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('rowCount')}"
                    th:errors="*{rowCount}">
                </div>

                <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('seatsPerRow')}"
                    th:errors="*{seatsPerRow}">
                </div>

                <button class="btn btn-primary">
                    Create Screen & Seats
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
