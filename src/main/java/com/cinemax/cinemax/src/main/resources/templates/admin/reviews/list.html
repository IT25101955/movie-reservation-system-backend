<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Review Management | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/}">

            🎬 CineMax Movies

        </a>

        <span class="text-white">
            Review Management
        </span>

    </div>

</nav>


<div class="container py-5">

    <h2>
        Customer Reviews
    </h2>


    <p class="text-muted">

        Review and moderate customer ratings
        and comments.

    </p>


    <div
        th:if="${param.approved}"
        class="alert alert-success">

        Review approved successfully.

    </div>


    <div
        th:if="${param.rejected}"
        class="alert alert-warning">

        Review rejected.

    </div>


    <div class="table-responsive">

        <table
            class="table table-hover bg-white shadow-sm">

            <thead>

            <tr>

                <th>Movie</th>

                <th>Customer</th>

                <th>Rating</th>

                <th>Review</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody>


            <tr
                th:each="review : ${reviews}">


                <td
                    th:text="${review.movie.title}">
                </td>


                <td>

                    <span
                        th:text="${review.user.fullName}">
                    </span>

                    <br>

                    <small
                        class="text-muted"
                        th:text="${review.user.email}">
                    </small>

                </td>


                <td>

                    ⭐

                    <span
                        th:text="${review.rating}">
                    </span>

                    / 5

                </td>


                <td
                    style="max-width:350px"
                    th:text="${review.comment}">
                </td>


                <td>

                    <span
                        class="badge bg-secondary"
                        th:text="${review.status}">
                    </span>

                </td>


                <td>


                    <div
                        th:if="${review.status.name() == 'PENDING'}">


                        <form
                            th:action="@{/admin/reviews/{id}/approve(id=${review.id})}"
                            method="post"
                            class="d-inline">

                            <button
                                class="btn btn-sm btn-success">

                                Approve

                            </button>

                        </form>


                        <form
                            th:action="@{/admin/reviews/{id}/reject(id=${review.id})}"
                            method="post"
                            class="d-inline">

                            <button
                                class="btn btn-sm btn-danger">

                                Reject

                            </button>

                        </form>


                    </div>

                </td>

            </tr>


            <tr
                th:if="${#lists.isEmpty(reviews)}">

                <td
                    colspan="6"
                    class="text-center text-muted">

                    No customer reviews available.

                </td>

            </tr>


            </tbody>

        </table>

    </div>

</div>

</body>
</html>
