<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Booking History | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div th:if="${param.reviewSubmitted}" class="alert alert-success">
        Your review was submitted and is awaiting administrator approval.
    </div>

    <div class="d-flex justify-content-between">

        <div>

            <h2>
                🎟 My Booking History
            </h2>

            <p class="text-muted">
                View your current and previous CineMax bookings.
            </p>

        </div>


        <a
            th:href="@{/movies}"
            class="btn btn-dark">

            Browse Movies

        </a>

    </div>


    <div
        th:if="${#lists.isEmpty(bookings)}"
        class="alert alert-info mt-4">

        No booking history available.

    </div>


    <div
        class="card mb-3 shadow-sm"
        th:each="booking : ${bookings}">

        <div class="card-body">


            <div class="row align-items-center">


                <div class="col-md-8">

                    <div th:if="${booking.showSchedule != null}">

                        <h4
                            th:text="${booking.showSchedule.movie.title}">
                        </h4>


                        <p class="mb-1">

                            <strong>Theatre:</strong>

                            <span
                                th:text="${booking.showSchedule.screen.theatre.name}">
                            </span>

                        </p>


                        <p class="mb-1">

                            <strong>Date:</strong>

                            <span
                                th:text="${booking.showSchedule.showDate}">
                            </span>

                            at

                            <span
                                th:text="${booking.showSchedule.startTime}">
                            </span>

                        </p>

                    </div>


                    <div
                        th:if="${booking.showSchedule == null}"
                        class="alert alert-warning py-2">

                        The show details for this booking are no longer available.

                    </div>


                    <p class="mb-1">

                        <strong>Booking:</strong>

                        <span
                            th:text="${booking.bookingReference}">
                        </span>

                    </p>


                    <p>

                        <strong>Status:</strong>

                        <span
                            class="badge bg-secondary"
                            th:text="${booking.status}">
                        </span>

                    </p>

                </div>


                <div class="col-md-4 text-end">

                    <a
                        th:href="@{/account/bookings/{id}(id=${booking.id})}"
                        class="btn btn-primary">

                        View Details

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
