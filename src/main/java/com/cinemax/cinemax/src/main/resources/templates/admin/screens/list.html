<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Screens | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>Screen Management</h2>

        <a th:href="@{/admin/screens/add}"
           class="btn btn-primary">

            + Add Screen

        </a>

    </div>

    <div th:if="${param.success}"
         class="alert alert-success">
        Screen saved successfully.
    </div>

    <div th:if="${param.deleted}"
         class="alert alert-success">
        Screen deactivated successfully. Existing bookings were preserved.
    </div>

    <div th:if="${param.restored}"
         class="alert alert-success">
        Screen restored successfully.
    </div>

    <table class="table bg-white shadow-sm">

        <thead>

        <tr>

            <th>Screen</th>
            <th>Theatre</th>
            <th>Rows</th>
            <th>Seats / Row</th>
            <th>Capacity</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="screen : ${screens}">

            <td th:text="${screen.name}"></td>

            <td th:text="${screen.theatre.name}">
            </td>

            <td th:text="${screen.rowCount}">
            </td>

            <td th:text="${screen.seatsPerRow}">
            </td>

            <td th:text="${screen.capacity}">
            </td>

            <td>
                <span th:if="${screen.active}"
                      class="badge bg-success">ACTIVE</span>
                <span th:unless="${screen.active}"
                      class="badge bg-secondary">DELETED</span>
            </td>

            <td>

                <a
                    th:href="@{/admin/screens/seats/{id}(id=${screen.id})}"
                    class="btn btn-sm btn-info">

                    View Seats

                </a>

                <a
                    th:if="${screen.active}"
                    th:href="@{/admin/screens/edit/{id}(id=${screen.id})}"
                    class="btn btn-sm btn-warning">

                    Edit

                </a>

                <form
                    th:if="${screen.active}"
                    th:action="@{/admin/screens/{id}/delete(id=${screen.id})}"
                    method="post"
                    class="d-inline">

                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Delete this screen?')">
                        Delete
                    </button>

                </form>

                <form
                    th:unless="${screen.active}"
                    th:action="@{/admin/screens/{id}/restore(id=${screen.id})}"
                    method="post"
                    class="d-inline">

                    <button type="submit"
                            class="btn btn-sm btn-success">
                        Restore
                    </button>

                </form>

                <a th:href="@{/admin/theatres}"
                    class="btn btn-secondary">
                    Theatres
                </a>

                <a th:href="@{/admin/shows}"
                    class="btn btn-dark">
                    Show Scheduling
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
