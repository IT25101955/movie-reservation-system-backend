<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Rate & Review | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark text-white">


<div class="container py-5">

    <div
        class="card shadow mx-auto"
        style="max-width:700px">

        <div class="card-body p-4 text-dark">


            <h2>
                ⭐ Rate & Review
            </h2>


            <h4
                th:text="${movie.title}">
            </h4>


            <p class="text-muted">

                Share your experience with
                other CineMax customers.

            </p>


            <div
                th:if="${reviewError}"
                class="alert alert-danger"
                th:text="${reviewError}">
            </div>


            <form
                th:action="@{/reviews/movie/{id}(id=${movie.id})}"
                th:object="${reviewRequest}"
                method="post">


                <div class="mb-3">

                    <label class="form-label">
                        Rating
                    </label>


                    <select
                        class="form-select"
                        th:field="*{rating}">

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ Excellent
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ Very Good
                        </option>

                        <option value="3">
                            ⭐⭐⭐ Good
                        </option>

                        <option value="2">
                            ⭐⭐ Fair
                        </option>

                        <option value="1">
                            ⭐ Poor
                        </option>

                    </select>


                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('rating')}"
                        th:errors="*{rating}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Your Review
                    </label>


                    <textarea
                        class="form-control"
                        rows="6"
                        th:field="*{comment}"
                        placeholder="Tell us what you thought about the movie...">
                    </textarea>


                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('comment')}"
                        th:errors="*{comment}">
                    </div>

                </div>


                <div class="alert alert-info">

                    Your review will be checked
                    by CineMax administration
                    before it becomes publicly visible.

                </div>


                <button
                    class="btn btn-danger"
                    type="submit">

                    Submit Review

                </button>


                <a
                    th:href="@{/movies/{id}(id=${movie.id})}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
