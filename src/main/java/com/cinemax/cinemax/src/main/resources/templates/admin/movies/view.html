<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Movie Details | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            🎬 CineMax Movies

        </a>

    </div>

</nav>


<div class="container py-5">


    <div class="card shadow">

        <div class="row g-0">


            <div class="col-md-4">

                <img
                    th:if="${movie.posterUrl != null && !movie.posterUrl.isEmpty()}"
                    th:src="${movie.posterUrl}"
                    class="img-fluid rounded-start"
                    alt="Movie Poster">

            </div>


            <div class="col-md-8">

                <div class="card-body p-4">


                    <h2
                        th:text="${movie.title}">
                    </h2>


                    <p>
                        <strong>Genre:</strong>

                        <span th:text="${movie.genre}">
                        </span>
                    </p>


                    <p>
                        <strong>Language:</strong>

                        <span th:text="${movie.language}">
                        </span>
                    </p>


                    <p>
                        <strong>Duration:</strong>

                        <span th:text="${movie.durationMinutes}">
                        </span>

                        minutes
                    </p>


                    <p>
                        <strong>Release Date:</strong>

                        <span th:text="${movie.releaseDate}">
                        </span>
                    </p>


                    <p>
                        <strong>Status:</strong>

                        <span th:text="${movie.status}">
                        </span>
                    </p>


                    <p>
                        <strong>Cast:</strong>

                        <span th:text="${movie.cast}">
                        </span>
                    </p>


                    <p>
                        <strong>Description:</strong>
                    </p>


                    <p th:text="${movie.description}">
                    </p>


                    <a
                        th:if="${movie.trailerUrl != null && !movie.trailerUrl.isEmpty()}"
                        th:href="${movie.trailerUrl}"
                        target="_blank"
                        class="btn btn-danger">

                        ▶ Watch Trailer

                    </a>


                    <a
                        th:href="@{/admin/movies}"
                        class="btn btn-secondary">

                        Back

                    </a>


                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
