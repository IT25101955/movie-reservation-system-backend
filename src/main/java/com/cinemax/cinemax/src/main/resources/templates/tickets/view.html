<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>E-Ticket | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark">


<div class="container py-5">

    <div
        class="card shadow mx-auto"
        style="max-width:750px">


        <div class="card-header bg-danger text-white">

            <h2 class="mb-0">
                🎬 CineMax Movies
            </h2>

            <small>
                Electronic Movie Ticket
            </small>

        </div>


        <div class="card-body p-4">


            <h3
                th:text="${ticket.booking.showSchedule.movie.title}">
            </h3>


            <hr>


            <p>

                <strong>Ticket Number:</strong>

                <span
                    th:text="${ticket.ticketNumber}">
                </span>

            </p>


            <p>

                <strong>Booking Reference:</strong>

                <span
                    th:text="${ticket.booking.bookingReference}">
                </span>

            </p>


            <p>

                <strong>Customer:</strong>

                <span
                    th:text="${ticket.booking.user.fullName}">
                </span>

            </p>


            <p>

                <strong>Theatre:</strong>

                <span
                    th:text="${ticket.booking.showSchedule.screen.theatre.name}">
                </span>

            </p>


            <p>

                <strong>Location:</strong>

                <span
                    th:text="${ticket.booking.showSchedule.screen.theatre.location}">
                </span>

            </p>


            <p>

                <strong>Screen:</strong>

                <span
                    th:text="${ticket.booking.showSchedule.screen.name}">
                </span>

            </p>


            <p>

                <strong>Date:</strong>

                <span
                    th:text="${ticket.booking.showSchedule.showDate}">
                </span>

            </p>


            <p>

                <strong>Time:</strong>

                <span
                    th:text="${ticket.booking.showSchedule.startTime}">
                </span>

            </p>


            <p>

                <strong>Seats:</strong>

                <span
                    th:each="bs, stat : ${bookingSeats}">

                    <span
                        th:text="${bs.seat.seatCode}">
                    </span>

                    <span
                        th:unless="${stat.last}">
                        ,
                    </span>

                </span>

            </p>


            <p>

                <strong>Amount:</strong>

                Rs.

                <span
                    th:text="${ticket.booking.totalAmount}">
                </span>

            </p>


            <div class="alert alert-success">

                ✓ Payment Confirmed

            </div>


            <a
                th:href="@{/tickets/{id}/download(id=${ticket.id})}"
                class="btn btn-danger">

                Download PDF

            </a>


            <a
                th:href="@{/account/bookings}"
                class="btn btn-secondary">

                Booking History

            </a>

        </div>

    </div>

</div>

</body>
</html>
