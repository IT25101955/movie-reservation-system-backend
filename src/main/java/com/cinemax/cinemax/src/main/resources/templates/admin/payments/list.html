<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payments | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>💳 Payment Management</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-dark">Dashboard</a>
    </div>

    <div th:if="${param.updated}" class="alert alert-success mt-4">The pending payment was resolved.</div>
    <div th:if="${param.resolveError}" class="alert alert-danger mt-4">This payment has already been resolved or cannot be updated.</div>
    <form method="get" class="row my-4">
        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="">All Payments</option>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary">Filter</button></div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover bg-white shadow-sm align-middle">
            <thead><tr><th>Transaction</th><th>Booking</th><th>Customer</th><th>Amount</th><th>Card</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.transactionReference}"></td>
                <td th:text="${payment.booking.bookingReference}"></td>
                <td th:text="${payment.booking.user.email}"></td>
                <td>Rs. <span th:text="${payment.amount}"></span></td>
                <td>**** <span th:text="${payment.cardLastFour}"></span></td>
                <td th:text="${payment.status}"></td>
                <td>
                    <div th:if="${payment.status.name() == 'PENDING'}" class="d-flex gap-1">
                        <form th:action="@{/admin/payments/{id}/success(id=${payment.id})}" method="post">
                            <button class="btn btn-sm btn-success">Mark Success</button>
                        </form>
                        <form th:action="@{/admin/payments/{id}/failed(id=${payment.id})}" method="post">
                            <button class="btn btn-sm btn-danger">Mark Failed</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(payments)}"><td colspan="7" class="text-center text-muted">No payments found.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
