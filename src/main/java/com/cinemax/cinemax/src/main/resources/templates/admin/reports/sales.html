<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales Report | CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>📊 CineMax Sales Report</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-dark">Dashboard</a>
    </div>

    <div th:if="${reportError}" class="alert alert-danger mt-4" th:text="${reportError}"></div>
    <form method="get" class="row g-3 my-4">
        <div class="col-md-4"><label class="form-label">From</label><input type="date" name="startDate" th:value="${startDate}" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">To</label><input type="date" name="endDate" th:value="${endDate}" class="form-control"></div>
        <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary w-100">Generate Report</button></div>
    </form>

    <div class="row g-3">
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><h6>Total Revenue</h6><h3>Rs. <span th:text="${totalRevenue}">0</span></h3></div></div></div>
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><h6>Successful Payments</h6><h3 th:text="${transactions}">0</h3></div></div></div>
        <div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><h6>Tickets Sold</h6><h3 th:text="${ticketsSold}">0</h3></div></div></div>
    </div>

    <h4 class="mt-5">Revenue by Movie</h4>
    <table class="table bg-white shadow-sm">
        <thead><tr><th>Movie</th><th>Transactions</th><th>Revenue</th></tr></thead>
        <tbody>
        <tr th:each="row : ${movieRevenue}"><td th:text="${row.label}"></td><td th:text="${row.transactions}"></td><td>Rs. <span th:text="${row.revenue}"></span></td></tr>
        <tr th:if="${#lists.isEmpty(movieRevenue)}"><td colspan="3" class="text-center text-muted">No successful payments in this period.</td></tr>
        </tbody>
    </table>

    <h4 class="mt-5">Revenue by Theatre</h4>
    <table class="table bg-white shadow-sm">
        <thead><tr><th>Theatre</th><th>Transactions</th><th>Revenue</th></tr></thead>
        <tbody>
        <tr th:each="row : ${theatreRevenue}"><td th:text="${row.label}"></td><td th:text="${row.transactions}"></td><td>Rs. <span th:text="${row.revenue}"></span></td></tr>
        <tr th:if="${#lists.isEmpty(theatreRevenue)}"><td colspan="3" class="text-center text-muted">No successful payments in this period.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
