<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Payment Pending | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark">

<div class="container py-5">

    <div
        class="card mx-auto text-center"
        style="max-width:650px">

        <div class="card-body p-5">

            <h1 class="text-warning">
                Payment Pending
            </h1>


            <p>

                Transaction Reference:

                <strong
                    th:text="${payment.transactionReference}">
                </strong>

            </p>


            <p>

                Amount:

                <strong>

                    Rs.

                    <span
                        th:text="${payment.amount}">
                    </span>

                </strong>

            </p>


            <div class="alert alert-warning">

                The payment gateway has not yet
                confirmed the transaction.

            </div>


            <a
                th:href="@{/movies}"
                class="btn btn-dark">

                Back to Movies

            </a>

        </div>

    </div>

</div>

</body>
</html>
