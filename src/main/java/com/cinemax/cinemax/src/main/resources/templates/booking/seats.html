<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Select Seats | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #111;
            color: white;
        }

        .cinema-screen {
            max-width: 700px;
            margin: 30px auto 50px;
            padding: 12px;
            text-align: center;
            background: white;
            color: black;
            box-shadow: 0 15px 30px rgba(255,255,255,.25);
        }

        .seat-grid {
            display: grid;
            gap: 10px;
            justify-content: center;
        }

        .seat input {
            display: none;
        }

        .seat span {
            display: flex;
            width: 48px;
            height: 42px;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #198754;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .seat input:checked + span {
            background: #ffc107;
            color: black;
        }

        .seat.booked span {
            background: #dc3545;
            cursor: not-allowed;
        }

        .seat.held span {
            background: #6c757d;
            cursor: not-allowed;
        }

    </style>

</head>


<body>


<div class="container py-5">

    <h2 th:text="${show.movie.title}">
    </h2>

    <p>

        <span
            th:text="${show.screen.theatre.name}">
        </span>

        -

        <span
            th:text="${show.screen.name}">
        </span>

    </p>

    <p>

        <span th:text="${show.showDate}">
        </span>

        at

        <span th:text="${show.startTime}">
        </span>

    </p>


    <div th:if="${param.error}"
         class="alert alert-danger">

        One or more selected seats are unavailable.
        Please select again.

    </div>


    <div th:if="${param.expired}"
         class="alert alert-warning">

        Your previous seat hold expired.
        Please select the seats again.

    </div>


    <div class="cinema-screen">
        SCREEN
    </div>


    <form
        th:action="@{/booking/show/{id}/hold(id=${show.id})}"
        method="post">


        <div
            class="seat-grid"
            th:style="'grid-template-columns: repeat(' + ${show.screen.seatsPerRow} + ', 48px);'">


            <label
                th:each="seat : ${seats}"
                class="seat"
                th:classappend="${
                    bookedSeatIds.contains(seat.id)
                    ? ' booked'
                    : (
                        otherHeldSeatIds.contains(seat.id)
                        ? ' held'
                        : ''
                    )
                }">


                <input
                    type="checkbox"
                    name="selectedSeatIds"
                    th:value="${seat.id}"
                    th:disabled="${
                        bookedSeatIds.contains(seat.id)
                        ||
                        otherHeldSeatIds.contains(seat.id)
                    }">


                <span th:text="${seat.seatCode}">
                </span>

            </label>

        </div>


        <div class="mt-5 text-center">

            <p>
                🟩 Available &nbsp;
                🟨 Selected &nbsp;
                🟥 Booked &nbsp;
                ⬛ Held
            </p>


            <button
                type="submit"
                class="btn btn-danger btn-lg">

                Continue Booking

            </button>

        </div>

    </form>

</div>

</body>
</html>
