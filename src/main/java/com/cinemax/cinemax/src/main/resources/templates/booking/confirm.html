<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Confirm Booking | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark text-white">


<div class="container py-5">

    <div
        class="card bg-secondary text-white shadow mx-auto"
        style="max-width:750px">


        <div class="card-body p-4">


            <h2>
                Confirm Your Booking
            </h2>


            <div class="alert alert-warning mt-3">

                Your seats are held for:

                <strong id="timer">
                    05:00
                </strong>

            </div>


            <h4
                th:text="${show.movie.title}">
            </h4>


            <p>

                <strong>Theatre:</strong>

                <span
                    th:text="${show.screen.theatre.name}">
                </span>

            </p>


            <p>

                <strong>Screen:</strong>

                <span
                    th:text="${show.screen.name}">
                </span>

            </p>


            <p>

                <strong>Date:</strong>

                <span
                    th:text="${show.showDate}">
                </span>

            </p>


            <p>

                <strong>Time:</strong>

                <span
                    th:text="${show.startTime}">
                </span>

            </p>


            <p>

                <strong>Seats:</strong>

                <span
                    th:each="hold, stat : ${holds}">

                    <span
                        th:text="${hold.seat.seatCode}">
                    </span>

                    <span
                        th:unless="${stat.last}">
                        ,
                    </span>

                </span>

            </p>


            <h4>

                Total:
                Rs.

                <span th:text="${total}">
                </span>

            </h4>


            <form
                th:action="@{/booking/confirm}"
                method="post"
                class="d-inline">

                <input
                    type="hidden"
                    name="showId"
                    th:value="${show.id}">

                <button
                    class="btn btn-success btn-lg">

                    Confirm & Continue to Payment

                </button>

            </form>


            <form
                th:action="@{/booking/cancel-hold}"
                method="post"
                class="d-inline">

                <input
                    type="hidden"
                    name="showId"
                    th:value="${show.id}">

                <button
                    class="btn btn-danger">

                    Cancel

                </button>

            </form>

        </div>

    </div>

</div>


<script th:inline="javascript">

    const expiry =
        /*[[${expiryMillis}]]*/ 0;

    const timer =
        document.getElementById("timer");


    const interval =
        setInterval(() => {

            const remaining =
                expiry - Date.now();


            if (remaining <= 0) {

                clearInterval(interval);

                timer.textContent =
                    "Expired";

                window.location.href =
                    "/booking/show/"
                    + /*[[${show.id}]]*/ ""
                    + "/seats?expired";

                return;
            }


            const minutes =
                Math.floor(
                    remaining / 60000
                );


            const seconds =
                Math.floor(
                    (remaining % 60000)
                    / 1000
                );


            timer.textContent =
                String(minutes)
                    .padStart(2, "0")
                + ":"
                + String(seconds)
                    .padStart(2, "0");

        }, 1000);

</script>


</body>
</html>
