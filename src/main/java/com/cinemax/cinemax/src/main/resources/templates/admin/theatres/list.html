<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Theatres | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            🎬 CineMax Movies
        </a>

        <span class="text-white">
            Theatre Management
        </span>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>Theatres</h2>

        <a th:href="@{/admin/theatres/add}"
           class="btn btn-primary">

            + Add Theatre

        </a>

    </div>


    <div th:if="${param.success}"
         class="alert alert-success">

        Theatre saved successfully.

    </div>

    <div th:if="${param.deleted}"
         class="alert alert-success">

        Theatre deactivated successfully. Existing records were preserved.

    </div>

    <div th:if="${param.restored}"
         class="alert alert-success">

        Theatre restored successfully.

    </div>


    <table class="table table-hover bg-white shadow-sm">

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Facilities</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="theatre : ${theatres}">

            <td th:text="${theatre.id}"></td>

            <td th:text="${theatre.name}"></td>

            <td th:text="${theatre.location}"></td>

            <td th:text="${theatre.facilities}"></td>

            <td>
                <span th:if="${theatre.active}"
                      class="badge bg-success">ACTIVE</span>
                <span th:unless="${theatre.active}"
                      class="badge bg-secondary">DELETED</span>
            </td>

            <td>

                <a
                    th:if="${theatre.active}"
                    th:href="@{/admin/theatres/edit/{id}(id=${theatre.id})}"
                    class="btn btn-sm btn-warning">

                    Edit

                </a>

                <form
                    th:if="${theatre.active}"
                    th:action="@{/admin/theatres/{id}/delete(id=${theatre.id})}"
                    method="post"
                    class="d-inline">

                    <button
                        type="submit"
                        class="btn btn-sm btn-danger"
                        onclick="return confirm('Delete this theatre?')">

                        Delete

                    </button>

                </form>

                <form
                    th:unless="${theatre.active}"
                    th:action="@{/admin/theatres/{id}/restore(id=${theatre.id})}"
                    method="post"
                    class="d-inline">

                    <button type="submit"
                            class="btn btn-sm btn-success">
                        Restore
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

    <a th:href="@{/admin/screens}"
        class="btn btn-dark">
        Manage Screens
    </a>

    <a th:href="@{/admin/shows}"
        class="btn btn-secondary">
        Show Scheduling
    </a>

</div>

</body>
</html>
