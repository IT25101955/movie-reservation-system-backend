<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Booking | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark text-white">


<div class="container py-5">

    <div
        class="card bg-secondary text-white shadow mx-auto"
        style="max-width:700px">

        <div class="card-body p-4">


            <h2>
                🎟 Booking Created
            </h2>


            <p class="text-warning">

                Payment is still pending.

            </p>


            <p>

                <strong>Booking Reference:</strong>

                <span
                    th:text="${booking.bookingReference}">
                </span>

            </p>


            <p>

                <strong>Movie:</strong>

                <span
                    th:text="${booking.showSchedule.movie.title}">
                </span>

            </p>


            <p>

                <strong>Seats:</strong>

                <span
                    th:each="bs, stat : ${bookingSeats}">

                    <span
                        th:text="${bs.seat.seatCode}">
                    </span>

                    <span
                        th:unless="${stat.last}">
                        ,
                    </span>

                </span>

            </p>


            <p>

                <strong>Total:</strong>

                Rs.

                <span
                    th:text="${booking.totalAmount}">
                </span>

            </p>


            <p>

                <strong>Status:</strong>

                <span
                    th:text="${booking.status}">
                </span>

            </p>


            <div class="alert alert-info">

                Payment processing will be connected
                in Step 6.

            </div>


            <a
                th:href="@{/payment/{id}(id=${booking.id})}"
                class="btn btn-success btn-lg">

                Pay Now
            </a>

        </div>

    </div>

</div>

</body>
</html>
