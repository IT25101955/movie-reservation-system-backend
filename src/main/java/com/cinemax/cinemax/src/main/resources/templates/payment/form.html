<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Payment | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-dark text-white">


<div class="container py-5">

    <div
        class="card shadow mx-auto"
        style="max-width:650px">

        <div class="card-body p-4 text-dark">


            <h2>
                💳 CineMax Payment
            </h2>


            <hr>


            <p>

                <strong>Booking:</strong>

                <span
                    th:text="${booking.bookingReference}">
                </span>

            </p>


            <p>

                <strong>Movie:</strong>

                <span
                    th:text="${booking.showSchedule.movie.title}">
                </span>

            </p>


            <h4>

                Amount:
                Rs.

                <span
                    th:text="${booking.totalAmount}">
                </span>

            </h4>


            <div
                th:if="${paymentError}"
                class="alert alert-danger"
                th:text="${paymentError}">
            </div>


            <form
                th:action="@{/payment/process}"
                th:object="${paymentRequest}"
                method="post">


                <input
                    type="hidden"
                    name="bookingId"
                    th:value="${booking.id}">


                <div class="mb-3">

                    <label class="form-label">
                        Cardholder Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{cardholderName}">


                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('cardholderName')}"
                        th:errors="*{cardholderName}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Card Number
                    </label>

                    <input
                        type="text"
                        maxlength="16"
                        class="form-control"
                        th:field="*{cardNumber}"
                        placeholder="4242424242424242">


                    <div
                        class="text-danger"
                        th:if="${#fields.hasErrors('cardNumber')}"
                        th:errors="*{cardNumber}">
                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expiry
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            th:field="*{expiryDate}"
                            placeholder="12/28">


                        <div
                            class="text-danger"
                            th:if="${#fields.hasErrors('expiryDate')}"
                            th:errors="*{expiryDate}">
                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            CVV
                        </label>

                        <input
                            type="password"
                            maxlength="3"
                            class="form-control"
                            th:field="*{cvv}">


                        <div
                            class="text-danger"
                            th:if="${#fields.hasErrors('cvv')}"
                            th:errors="*{cvv}">
                        </div>

                    </div>

                </div>



                <button
                    type="submit"
                    class="btn btn-success w-100 btn-lg">

                    Pay Rs.
                    <span
                        th:text="${booking.totalAmount}">
                    </span>

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
