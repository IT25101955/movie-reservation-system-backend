<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Show | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow mx-auto"
         style="max-width:750px">

        <div class="card-body">

            <h2>Create / Update Show</h2>


            <div
                th:if="${scheduleError}"
                class="alert alert-danger"
                th:text="${scheduleError}">
            </div>


            <form
                th:action="@{/admin/shows/save}"
                th:object="${showSchedule}"
                method="post">

                <input
                    type="hidden"
                    th:field="*{id}">


                <div class="mb-3">

                    <label class="form-label">
                        Movie
                    </label>

                    <select
                        class="form-select"
                        name="movieId"
                        required>

                        <option value="">
                            Select Movie
                        </option>

                        <option
                            th:each="movie : ${movies}"
                            th:value="${movie.id}"
                            th:text="${movie.title}"
                            th:selected="${showSchedule.movie != null
                                && showSchedule.movie.id == movie.id}">
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Screen
                    </label>

                    <select
                        class="form-select"
                        name="screenId"
                        required>

                        <option value="">
                            Select Screen
                        </option>

                        <option
                            th:each="screen : ${screens}"
                            th:value="${screen.id}"
                            th:text="${screen.theatre.name + ' - ' + screen.name}"
                            th:selected="${showSchedule.screen != null
                                && showSchedule.screen.id == screen.id}">
                        </option>

                    </select>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            th:field="*{showDate}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Start Time
                        </label>

                        <input
                            type="time"
                            class="form-control"
                            th:field="*{startTime}">

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Ticket Price (LKR)
                    </label>

                    <input
                        type="number"
                        min="1"
                        step="0.01"
                        class="form-control"
                        th:field="*{ticketPrice}">

                </div>


                <button class="btn btn-primary">
                    Save Show
                </button>

                <a
                    th:href="@{/admin/shows}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
