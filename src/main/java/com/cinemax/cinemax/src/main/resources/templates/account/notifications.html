<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Notifications | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <h2>
        🔔 Notifications
    </h2>


    <div
        th:if="${#lists.isEmpty(notifications)}"
        class="alert alert-info">

        You don't have any notifications yet.

    </div>


    <div
        th:each="notification : ${notifications}"
        class="card mb-3 shadow-sm">

        <div class="card-body">

            <h5
                th:text="${notification.title}">
            </h5>


            <p
                th:text="${notification.message}">
            </p>


            <small class="text-muted">

                Email:

                <span
                    th:text="${notification.emailStatus}">
                </span>

            </small>


            <form
                th:if="${!notification.read}"
                th:action="@{/account/notifications/{id}/read(id=${notification.id})}"
                method="post"
                class="mt-3">

                <button
                    class="btn btn-sm btn-outline-primary">

                    Mark as Read

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
