<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Seat Layout | CineMax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        .seat {
            display: inline-flex;
            width: 50px;
            height: 42px;
            margin: 5px;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-weight: bold;
        }

        .screen-bar {
            max-width: 700px;
            margin: 30px auto;
            padding: 12px;
            background: #212529;
            color: white;
            text-align: center;
            border-radius: 50%;
        }

    </style>

</head>

<body>

<div class="container py-5 text-center">

    <h2 th:text="${screen.name}">
    </h2>

    <p>
        Capacity:
        <strong th:text="${screen.capacity}">
        </strong>
    </p>


    <div class="screen-bar">
    SCREEN
    </div>

    <div
        th:each="rowNumber : ${#numbers.sequence(0, screen.rowCount - 1)}"
        class="mb-2">

        <span
            class="me-3 fw-bold"
            th:text="${T(java.lang.String).valueOf(
                T(java.lang.Character).toChars(65 + rowNumber)
            )}">
        </span>

        <span
            th:each="seat : ${seats}"
            th:if="${seat.rowLabel ==
                T(java.lang.String).valueOf(
                    T(java.lang.Character).toChars(65 + rowNumber)
                )}"
            class="seat"
            th:text="${seat.seatCode}">
        </span>

    </div>


    <div style="max-width:850px; margin:auto">

        <span
            class="seat"
            th:each="seat : ${seats}"
            th:text="${seat.seatCode}">
        </span>

    </div>


    <br>

    <a th:href="@{/admin/screens}"
       class="btn btn-dark">

        Back

    </a>

</div>

</body>
</html>
