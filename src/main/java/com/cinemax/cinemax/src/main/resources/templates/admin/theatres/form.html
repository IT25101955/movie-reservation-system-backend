<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Theatre | CineMax Movies</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">

    <div class="card shadow mx-auto"
         style="max-width:700px">

        <div class="card-body">

            <h2>
                Theatre Details
            </h2>

            <form
                th:action="@{/admin/theatres/save}"
                th:object="${theatre}"
                method="post">

                <input
                    type="hidden"
                    th:field="*{id}">


                <div class="mb-3">

                    <label class="form-label">
                        Theatre Name
                    </label>

                    <input
                        class="form-control"
                        th:field="*{name}">

                    <div class="text-danger"
                         th:errors="*{name}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        class="form-control"
                        th:field="*{location}">

                    <div class="text-danger"
                         th:errors="*{location}">
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Facilities
                    </label>

                    <textarea
                        class="form-control"
                        th:field="*{facilities}"
                        placeholder="Parking, Dolby Atmos, AC, Food Court">
                    </textarea>

                </div>


                <button class="btn btn-primary">
                    Save Theatre
                </button>

                <a th:href="@{/admin/theatres}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
