# Application name
spring.application.name=cinemax

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/cinemax_db

# MySQL login details
spring.datasource.username=root
spring.datasource.password=kottu+EGB@29

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Update tables without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Show SQL in terminal
spring.jpa.show-sql=true

# Format SQL
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate that we use MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# Email disabled for now
cinemax.mail.enabled=false